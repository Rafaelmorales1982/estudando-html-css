<!-- Define o tipo de documento como HTML5 para o navegador -->
<!doctype html>

<!-- Tag principal que envolve todo o documento; lang="pt-BR" especifica o idioma como Português do Brasil -->
<html lang="pt-BR">
  
  <!-- A seção <head> contém metadados e informações sobre o documento que não aparecem diretamente na página -->
  <head>
    <!-- Define a codificação de caracteres como UTF-8, garantindo que acentos, ç e emojis funcionem corretamente -->
    <meta charset="UTF-8" />
    
    <!-- Configura a página para ser responsiva, adaptando a largura ao tamanho da tela do dispositivo (celular, tablet, PC) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Define o título da aba do navegador -->
    <title>Meu HTML</title>
  </head>
  
  <!-- O <body> contém todo o conteúdo visível da página (textos, imagens, links, etc.) -->
  <body>
    <!-- Título principal da página (nível 1) -->
    <h1>Meu HTML</h1>
    
    <!-- Parágrafo de texto -->
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus quis
      vero impedit corporis, quos facilis, architecto quidem iure obcaecati ab
      aspernatur recusandae! Officiis suscipit unde ea quo consequuntur dolore
      architecto!
    </p>

    <!-- Elemento de texto em linha (inline) para o primeiro nome -->
    <span>Luiz Oltávio</span>
    
    <!-- Quebra de linha (força o próximo elemento a ir para a linha de baixo) -->
    <br>
    
    <!-- Elemento de texto em linha (inline) para o segundo nome -->
    <span>Rafael Morales</span>

  </body>
</html>
