<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação de caracteres como UTF-8 para suportar acentuação -->
  <meta charset="UTF-8">
  <!-- Garante que a página seja responsiva em dispositivos móveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que aparece na aba do navegador -->
  <title>Meu HTML - H1 até H6</title>
</head>
<body>
  
  <!-- H1: Título principal da página (deve ser único por página) -->
  <h1>Meu título</h1>
  
  <!-- Parágrafo de texto -->
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores, qui.</p>

  <!-- H2: Subtítulo de nível 2 (seção principal) -->
  <h2>Meu título</h2>

  <!-- H3: Subtítulo de nível 3 (subseção) -->
  <h3>Meu título</h3>

  <!-- H4: Subtítulo de nível 4 -->
  <h4>Meu título</h4>

  <!-- H5: Subtítulo de nível 5 -->
  <h5>Meu título</h5>
  
  <!-- H6: Subtítulo de nível 6 (o menor nível de cabeçalho) -->
  <h6>Meu título</h6>

</body>
</html>
